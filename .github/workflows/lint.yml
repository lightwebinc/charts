name: lint

on:
  # main only: a branch with a PR is covered by the pull_request run.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Render scenarios: ci/*.yaml (+ .expect assertions), examples/*.yaml, and
  # ci/reject/*.yaml for renders that must fail. See lightwebinc/ci helm-lint.
  lint:
    uses: lightwebinc/ci/.github/workflows/helm-lint.yml@e6098fcd1c4ecf7c0163e8599b4b3fb957562295 # main
    with:
      set: --set config.bindSource=2001:db8::21
