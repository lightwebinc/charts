name: lint

on:
  # main only: a branch with a PR is covered by the pull_request run.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Render scenarios live in ci/*.yaml and examples/*.yaml. The defaults use
  # sourceMode=ssm with an empty bindSource; the schema does not enforce the
  # pairing (the binary fails fast at startup instead), so lint and the default
  # render set a per-replica bindSource.
  lint:
    uses: lightwebinc/ci/.github/workflows/helm-lint.yml@bfcf31c675b8206453c90497534a72886933f0a9 # main
    with:
      set: --set config.bindSource=2001:db8::21
