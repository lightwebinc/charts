name: lint

on:
  # main only: a branch with a PR is covered by the pull_request run.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Render scenarios: ci/*.yaml (+ .expect assertions), examples/*.yaml, and
  # ci/reject/*.yaml for renders that must fail. See lightwebinc/ci helm-lint.
  lint:
    uses: lightwebinc/ci/.github/workflows/helm-lint.yml@b49f597d563387ae78f599ee22673124a602e736 # main
    with:
      # The examples leave peerId empty on purpose (it is per instance and must
      # never be copied between bridges), so their renders supply a synthetic one.
      examples-set: --set config.peerId=12D3KooWLRPJAEfHqoBUmnBrDmDcnLnkV8mWMHhqPZbrVqQZBEBu

