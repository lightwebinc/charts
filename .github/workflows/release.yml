name: release

# Manual, gated release. No automated tag-based trigger.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RELEASE to publish chart to OCI registry'
        required: true
      dry-run:
        description: 'Package only, push nothing'
        type: boolean
        default: false

jobs:
  release:
    if: inputs.confirm == 'RELEASE'
    permissions:
      contents: read
      packages: write
    uses: lightwebinc/ci/.github/workflows/helm-release.yml@e6098fcd1c4ecf7c0163e8599b4b3fb957562295 # main
    with:
      environment: ""
      dry-run: ${{ inputs.dry-run }}
