name: release

# Manual, gated release. No automated tag-based trigger.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RELEASE to publish chart to OCI registry'
        required: true
      dry-run:
        description: 'Package only, push nothing'
        type: boolean
        default: false

jobs:
  release:
    if: inputs.confirm == 'RELEASE'
    permissions:
      contents: read
      packages: write
    uses: lightwebinc/ci/.github/workflows/helm-release.yml@bfcf31c675b8206453c90497534a72886933f0a9 # main
    with:
      dry-run: ${{ inputs.dry-run }}
