name: release

# Manual, gated release. No automated tag-based trigger.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RELEASE to publish chart to OCI registry'
        required: true
      dry-run:
        description: 'Package only, push nothing'
        type: boolean
        default: false

jobs:
  release:
    if: inputs.confirm == 'RELEASE'
    permissions:
      contents: read
      packages: write
    uses: lightwebinc/ci/.github/workflows/helm-release.yml@9611b3eb4844452ec05c941a05ca3ccb50de15e8 # main
    with:

      dry-run: ${{ inputs.dry-run }}
