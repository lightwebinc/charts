name: release

# Manual, gated release. No automated tag-based trigger.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RELEASE to publish chart to OCI registry'
        required: true
      dry-run:
        description: 'Package only, push nothing'
        type: boolean
        default: false

jobs:
  release:
    if: inputs.confirm == 'RELEASE'
    permissions:
      contents: read
      packages: write
    uses: lightwebinc/ci/.github/workflows/helm-release.yml@b49f597d563387ae78f599ee22673124a602e736 # v0.2.0
    with:
      environment: ""
      dry-run: ${{ inputs.dry-run }}
