{{- include "arcade-bridge.validate" . -}}
{{- $c := .Values.config -}}
{{- $sink := eq ($c.mode | default "all") "sink" -}}
{{- $facade := include "arcade-bridge.facadeEnabled" . -}}
{{- $metricsPort := "" -}}
{{- if .Values.metrics.enabled -}}
{{- $metricsPort = include "arcade-bridge.port" ($c.metricsAddr | default "[::]:9167") -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "arcade-bridge.fullname" . }}
  labels:
    {{- include "arcade-bridge.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "arcade-bridge.selectorLabels" . | nindent 6 }}
  {{- if .Values.updateStrategy }}
  strategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  {{- else if eq .Values.networking.mode "host" }}
  {{- /* Host ports cannot be bound twice: a rolling update would leave the new
         pod crashlooping on "address already in use" until the old one died. */}}
  strategy:
    type: Recreate
  {{- end }}
  template:
    metadata:
      {{- /* One warning, worst first: a missing required flag exits 2 before any
             listener opens, so it hides everything after it anyway. */ -}}
      {{- $warn := "" }}
      {{- if and (not $sink) (or (not $c.advertise) (not $c.kafka)) }}
      {{- $warn = "config.advertise and config.kafka are required unless config.mode is sink: the bridge exits 2 at startup. Set advertise to the base URL merkle-service can dial for fetches, without the API prefix (the chart appends config.apiPrefix), and kafka to merkle-service's bootstrap list." }}
      {{- end }}
      {{- if or $warn .Values.podAnnotations }}
      annotations:
        {{- if $warn }}
        helm.sh/chart-warnings: {{ $warn | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "arcade-bridge.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "arcade-bridge.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if eq .Values.networking.mode "host" }}
      hostNetwork: true
      dnsPolicy: {{ .Values.networking.host.dnsPolicy }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- /* The distroless image has no shell, and the binary is the
                 entrypoint — flags are the whole configuration surface. */}}
          args:
            {{- include "arcade-bridge.args" . | trim | nindent 12 }}
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: subtree
              containerPort: {{ include "arcade-bridge.port" $c.subtreeListen | int }}
              protocol: TCP
            - name: block
              containerPort: {{ include "arcade-bridge.port" $c.blockListen | int }}
              protocol: TCP
            {{- /* The retrieval plane runs in every mode, sink included. */}}
            - name: retrieval
              containerPort: {{ include "arcade-bridge.port" $c.retrievalListen | int }}
              protocol: TCP
            {{- if $facade }}
            - name: facade
              containerPort: {{ include "arcade-bridge.port" ($c.facadeListen | default "[::]:9166") | int }}
              protocol: TCP
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ $metricsPort | int }}
              protocol: TCP
            {{- end }}
          {{- if .Values.metrics.enabled }}
          {{- /* Both probes live on the metrics listener; with metrics.enabled
                 false there is no endpoint to probe. */}}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path | default "/readyz" }}
              port: metrics
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path | default "/healthz" }}
              port: metrics
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
