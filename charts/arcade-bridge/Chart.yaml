apiVersion: v2
name: arcade-bridge
description: Landing-tier bridge for pushed delivery into an unmodified Arcade v2 + merkle-service stack. Terminates the subtree/block delivery lanes, announces and serves merkle-service's fetches locally, and optionally fronts Arcade's broadcast path with a facade that forwards one extended-format stream up the tunnel
type: application
version: 0.1.1
# appVersion MUST equal a tag published on ghcr.io/lightwebinc/arcade-bridge
# (the chart's tag:"" default pulls this). Images are published manually via the
# binary repo's image-publish.yml workflow; bump appVersion ONLY in lockstep with
# an image publish — binary git tags are NOT image tags until published.
appVersion: "0.1.0"
kubeVersion: ">= 1.27.0-0"
keywords:
  - bitcoin
  - bsv
  - multicast
  - arcade
  - brc-143
  - brc-144
home: https://github.com/lightwebinc/arcade-bridge
sources:
  - https://github.com/lightwebinc/arcade-bridge
  - https://github.com/lightwebinc/charts/tree/main/charts/arcade-bridge
maintainers:
  - name: lightwebinc
    url: https://github.com/lightwebinc
icon: https://raw.githubusercontent.com/lightwebinc/bsv-multicast/main/.assets/icon.svg
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/changes: |
    - kind: fixed
      description: an object whose merkle-service announce FAILED is now re-announced on its next redelivery instead of being suppressed as a duplicate forever; the cached bytes are kept either way so the retrieval plane can still serve a pull
    - kind: changed
      description: alert ArcadeBridgeLaneRejects is replaced by ArcadeBridgeLaneDropped over the new arcade_bridge_lane_connections_dropped_total — no arcade-bridge lane enforces a format policy, so the rejects rule could never fire, while a malformed stream had no series at all and showed up only in the log
    - kind: added
      description: metric arcade_bridge_lane_connections_dropped_total{lane} counts connections dropped on a framing fault, for parity with teranode_bridge_lane_connections_dropped_total
    - kind: changed
      description: wording — the component is described as a landing-tier bridge throughout; no template or value changes
    - kind: added
      description: Initial release — delivery lanes, retrieval plane, merkle-service announce, optional propagation facade with edge-ingress failover, ServiceMonitor/PrometheusRule, pod and host networking
