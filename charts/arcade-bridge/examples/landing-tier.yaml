# Landing tier, both halves: feed plus facade, on a node in front of an Arcade
# v2 + merkle-service stack.
#
#   helm install bridge . -f examples/landing-tier.yaml \
#     --set config.advertise=http://192.0.2.10:9165
#
# Feed: subtrees and blocks come down the tunnel, are cached, announced to
# merkle-service, and served to its fetches locally. Facade: Arcade's
# propagation POSTs /txs to this bridge, which forwards one bare EF stream up
# the tunnel to the fabric's open transaction ingress.
#
# hostNetwork because the stack is on a LAN, not in this k8s cluster: its
# containers must dial the node address named by config.advertise, Arcade must
# dial the facade, and the delivery link lands on that node too. That also
# makes the ports HOST ports: one bridge per node, and the rollout is Recreate
# (see values.yaml).
#
# Addresses use the documentation ranges (RFC 5737 192.0.2.0/24, RFC 3849
# 2001:db8::/32). Substitute your own.
networking:
  mode: host
  host:
    dnsPolicy: ClusterFirstWithHostNet

config:
  # Pinned to the delivery-facing address now that the deployment has settled.
  subtreeListen: "[2001:db8:3f::1]:9143"
  blockListen: "[2001:db8:3f::1]:9144"

  # Bound where the stack's containers can reach; advertise the same place,
  # WITHOUT the API prefix (the announced URL is advertise + apiPrefix).
  retrievalListen: "192.0.2.10:9165"
  advertise: "" # REQUIRED: e.g. "http://192.0.2.10:9165"

  kafka:
    - "192.0.2.10:19092"
  peerId: "arcade-bridge"

  # Facade on: Arcade lists http://192.0.2.10:9166 in its datahub_urls.
  facadeListen: "192.0.2.10:9166"
  # Up-tunnel failover pair: with a dual-homed tunnel these are the side-A and
  # side-B slot inners, reachable only through the tunnel. Joined into the
  # single comma-separated -edge-ingress flag; the binary walks them in order.
  edgeIngress:
    - "2001:db8:59::a"
    - "2001:db8:59::b"
  edgeTxPort: 8725

  # Asset fallback for parents the recent-submission cache misses. Unlike
  # advertise, this one carries the asset service's own prefix, because the
  # bridge dials it exactly as given.
  hydrateAsset: "http://192.0.2.20:20090/api/v1"

nodeSelector:
  topology.kubernetes.io/region: example
