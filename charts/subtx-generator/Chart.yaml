apiVersion: v2
name: subtx-generator
description: Load and control-frame generator for the BSV multicast pipeline
type: application
version: 0.3.6
# appVersion MUST equal a tag published on ghcr.io/lightwebinc/subtx-generator
# (the chart's tag:"" default pulls this). Images are published manually via the
# binary repo's image-publish.yml workflow; bump appVersion ONLY in lockstep with
# an image publish — binary git tags are NOT image tags until published.
appVersion: "0.4.0"
kubeVersion: ">= 1.27.0-0"
keywords:
  - bitcoin
  - bsv
  - multicast
  - load-test
  - brc-124
  - brc-127
  - brc-131
  - brc-132
  - brc-134
  - brc-143
  - brc-144
home: https://github.com/lightwebinc/subtx-generator
sources:
  - https://github.com/lightwebinc/subtx-generator
  - https://github.com/lightwebinc/subtx-generator-helm
maintainers:
  - name: lightwebinc
    url: https://github.com/lightwebinc
icon: https://raw.githubusercontent.com/lightwebinc/bsv-multicast/main/.assets/icon.svg
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/changes: |
    - kind: changed
      description: appVersion 0.3.4 — first image published since 0.2.6; the default image packages all seven binaries, including the send-subtree-push / send-block-push modes and tunnel-sink
    - kind: changed
      description: subtxGen.payloadFormat default brc128 (BRC-30 EF) — the fabric is EF-native; pin brc124 explicitly for raw-tx lanes
    - kind: added
      description: send-subtree-push / send-block-push modes (BRC-143/144 push lanes) — require image.tag set to an image built from v0.2.10+; the default appVersion image does not contain these binaries
    - kind: fixed
      description: command path is /usr/local/bin/<mode>; the previous /<mode> did not exist in the image
    - kind: changed
      description: appVersion 0.3.6 — dependency and CI maintenance only, no generator behaviour change. Built with Go 1.27.1.
